const today=new Date(); today.setHours(0,0,0,0);
function isOverdue(a){if(a.status==='closed'||!a.dueDate)return false;const d=new Date(a.dueDate);d.setHours(0,0,0,0);return d<today;}
function getStats(mid){const all=actions[mid]||[];return{open:all.filter(a=>a.status==='open'&&!isOverdue(a)).length,overdue:all.filter(isOverdue).length,closed:all.filter(a=>a.status==='closed').length};}
function getFiltered(mid){const all=actions[mid]||[];const f=filterFor[mid]||'all';if(f==='open')return all.filter(a=>a.status==='open'&&!isOverdue(a));if(f==='overdue')return all.filter(isOverdue);if(f==='closed')return all.filter(a=>a.status==='closed');return all;}

function switchTab(id){
  const tab=TABS.find(t=>t.id===id);
  if(tab&&tab.pin&&!unlockedTabs[id]){showPinModal(id,tab.pin,tab.label);return;}
  currentTab=id;addingFor=null;render();
}
function showPinModal(id,pin,label){
  const existing=document.getElementById('pin-overlay');if(existing)existing.remove();
  const ov=document.createElement('div');
  ov.id='pin-overlay';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:1000;';
  ov.innerHTML=`<div style="background:#fff;border-radius:8px;padding:30px 32px;width:300px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.25);">
    <div style="font-size:22px;margin-bottom:8px;">&#128274;</div>
    <div style="font-size:14px;font-weight:bold;color:${C.text};margin-bottom:4px;">${label}</div>
    <div style="font-size:11px;color:${C.muted};margin-bottom:20px;">Enter PIN to access this 1-on-1</div>
    <input id="pin-input" type="password" placeholder="PIN" maxlength="10" style="width:100%;border:1px solid ${C.border};border-radius:4px;padding:10px;font-size:16px;text-align:center;outline:none;font-family:Arial;letter-spacing:6px;">
    <div id="pin-error" style="height:14px;font-size:10px;color:${C.red};margin-top:6px;"></div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button onclick="closePinModal()" style="flex:1;padding:10px;border:1px solid ${C.border};border-radius:4px;background:#fff;color:${C.subText};cursor:pointer;font-family:Arial;font-size:12px;">Cancel</button>
      <button onclick="submitPin('${id}','${pin}')" style="flex:1;padding:10px;border:none;border-radius:4px;background:${C.primary};color:#fff;cursor:pointer;font-family:Arial;font-size:12px;font-weight:bold;">Unlock</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const inp=document.getElementById('pin-input');
  if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter')submitPin(id,pin);});}
}
function closePinModal(){const el=document.getElementById('pin-overlay');if(el)el.remove();}
function submitPin(id,correctPin){
  const inp=document.getElementById('pin-input');if(!inp)return;
  if(inp.value===correctPin){
    unlockedTabs[id]=true;closePinModal();currentTab=id;addingFor=null;render();
  } else {
    const err=document.getElementById('pin-error');if(err)err.textContent='Incorrect PIN — try again';
    inp.value='';inp.focus();
  }
}

function renderKpis(){
  const deptKpis=kpiNames[activeDept]||DEFAULT_KPIS[activeDept];
  const deptTabs=Object.keys(DEFAULT_KPIS).map(d=>{
    const dR=(kpiNames[d]||DEFAULT_KPIS[d]).map((_,i)=>ragMap[`${d}_${i}`]);
    const hasR=dR.some(r=>r==='R'),hasA=dR.some(r=>r==='A');
    const dot=hasR?`<span style="margin-left:4px;font-size:8px;color:${C.red};">●</span>`:hasA?`<span style="margin-left:4px;font-size:8px;color:${C.amber};">●</span>`:'';
    const active=activeDept===d;
    return `<button onclick="setDept('${d}')" style="padding:5px 12px;border-radius:3px;border:1px solid ${hasR?C.red+'50':hasA?C.amber+'40':C.border};cursor:pointer;font-size:11px;font-family:Arial;background:${active?C.primary:'transparent'};color:${active?C.white:C.subText};font-weight:${active?'bold':'normal'};">${d}${dot}</button>`;
  }).join('');

  const kpiRows=deptKpis.map((name,idx)=>{
    const key=`${activeDept}_${idx}`;const rag=ragMap[key];
    const ragBtns=['R','A','G'].map(r=>`<button onclick="setRag('${activeDept}',${idx},'${r}')" style="width:26px;height:26px;border-radius:3px;border:none;cursor:pointer;font-size:9px;font-weight:bold;font-family:Arial;background:${rag===r?RAG_COLORS[r]:RAG_COLORS[r]+'30'};color:${rag===r?'#fff':RAG_COLORS[r]};">${r}</button>`).join('');
    if(editingKpi===key) return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:${idx<4?`1px solid ${C.border}`:'none'};">
      <div style="width:9px;height:9px;border-radius:2px;background:${rag?RAG_COLORS[rag]:C.muted};flex-shrink:0;"></div>
      <div style="flex:1;display:flex;gap:6px;">
        <input id="kpiInput" value="${name.replace(/"/g,'&quot;')}" onkeydown="handleKpiKey(event,'${key}')" style="background:${C.bg};border:1px solid ${C.primary};border-radius:3px;padding:5px 8px;color:${C.text};font-size:11px;font-family:Arial;outline:none;flex:1;">
        <button onclick="saveKpi('${key}')" style="padding:4px 10px;background:${C.primary};color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:11px;font-family:Arial;font-weight:bold;">Save</button>
        <button onclick="cancelKpi()" style="padding:4px 8px;background:${C.muted};color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:11px;font-family:Arial;">✕</button>
      </div>
      <div style="display:flex;gap:3px;">${ragBtns}</div>
    </div>`;
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:${idx<4?`1px solid ${C.border}`:'none'};">
      <div style="width:9px;height:9px;border-radius:2px;background:${rag?RAG_COLORS[rag]:C.muted};flex-shrink:0;transition:background 0.3s;"></div>
      <div style="flex:1;"><span onclick="startEditKpi('${key}','${name.replace(/'/g,"\\'")}',${idx})" title="Click to customise" style="font-size:12px;color:${C.text};cursor:text;border-bottom:1px dashed ${C.muted};padding-bottom:1px;">${name}</span></div>
      <div style="display:flex;gap:3px;">${ragBtns}</div>
    </div>`;
  }).join('');

  return `<div style="background:${C.card};border:1px solid ${C.border};border-left:3px solid ${C.management};border-radius:4px;padding:18px;margin-bottom:16px;">
    <div style="font-size:9px;letter-spacing:2px;color:${C.primary};margin-bottom:4px;font-weight:bold;text-transform:uppercase;">KPI Dashboard</div>
    <div style="font-size:11px;color:${C.subText};margin-bottom:14px;">Click any KPI name to customise. Set RAG status live during the meeting.</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px;">${deptTabs}</div>
    ${kpiRows}
    <div style="margin-top:12px;padding:9px 12px;background:${C.primary}15;border-radius:3px;font-size:10.5px;color:${C.subText};">
      💡 <strong style="color:${C.primary};">Customise:</strong> Click any KPI name to replace it with your own metric. Coloured squares flag Red/Amber metrics at a glance.
    </div>
  </div>`;
}

function renderAgenda(mid){
  const agenda=AGENDAS[mid]||[];const color=META[mid].color;
  const rows=agenda.map((item,i)=>{
    const key=`${mid}_a_${i}`;const open=expandedItems[key];
    const subs=open?item.items.map(s=>`<div style="font-size:11px;color:${C.subText};padding:3px 0 3px 12px;border-left:2px solid ${color}60;margin-top:4px;line-height:1.6;">— ${s}</div>`).join(''):'';
    const prioritiesInline=open && mid.startsWith('oo_') ? (
      item.title==='Progress on Priorities' ? `<div style="margin-top:14px;">${renderPriorities(mid,'priorities','Priorities')}</div>` :
      item.title==='Blockers & Support'      ? `<div style="margin-top:14px;">${renderPriorities(mid,'blockers','Blockers & Support')}</div>` :
      item.title==='Development & Growth'    ? `<div style="margin-top:14px;">${renderPriorities(mid,'growth','Development & Growth')}</div>` :
      item.title==='Upcoming Focus'          ? `<div style="margin-top:14px;">${renderPriorities(mid,'focus','Upcoming Focus')}</div>` : ''
    ) : '';
    const okrInline=open && mid==='exco' && item.title==='Strategic OKR Review'
      ? `<div style="margin-top:14px;">${renderExcoOKRs()}</div>` : '';
    return `<div style="display:flex;gap:12px;padding:10px 0;border-bottom:${i<agenda.length-1?`1px solid ${C.border}`:'none'};">
      <div style="min-width:52px;font-size:10px;color:${color};font-weight:bold;padding-top:2px;">${item.time}</div>
      <div style="flex:1;">
        <div onclick="toggleItem('${key}')" style="font-size:12.5px;font-weight:bold;color:${C.text};cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
          <span style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">${item.title}${item.owner?`<span style="font-size:10px;font-weight:normal;color:${C.muted};background:${C.border};padding:2px 8px;border-radius:8px;">${item.owner}</span>`:''}</span>
          <span style="color:${C.muted};font-size:10px;margin-left:8px;flex-shrink:0;">${open?'▲':'▼'}</span>
        </div>${subs}${prioritiesInline}${okrInline}
      </div>
    </div>`;
  }).join('');
  return `<div style="background:${C.card};border:1px solid ${C.border};border-radius:4px;padding:18px;">
    <div style="font-size:9px;letter-spacing:2px;color:${color};margin-bottom:12px;font-weight:bold;text-transform:uppercase;">Agenda</div>
    ${rows}
  </div>`;
}

function renderPriorities(mid,sid,label){
  const key=`${mid}|${sid}`;
  const items=priorities[key]||[];
  const color=META[mid].color;
  const placeholder={priorities:'Add a priority…',blockers:'Add a blocker or support need…',growth:'Add a development or growth note…'}[sid]||'Add an item…';
  const rows=items.map((p,i)=>`
    <div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:${i<items.length-1?`1px solid ${C.border}`:'none'};">
      <div style="min-width:22px;height:22px;border-radius:50%;background:${color};color:#fff;font-size:10px;font-weight:bold;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${i+1}</div>
      <div style="flex:1;font-size:12.5px;color:${C.text};line-height:1.5;">${p}</div>
      <button onclick="deletePriority('${key}',${i})" style="padding:2px 7px;background:transparent;color:${C.muted};border:1px solid ${C.border};border-radius:3px;cursor:pointer;font-size:10px;font-family:Arial;" title="Remove">✕</button>
    </div>`).join('');
  const empty=items.length===0?`<div style="padding:10px 0 4px;font-size:12px;color:${C.muted};">Nothing listed yet — add one below.</div>`:'';
  return `
    <div style="background:${C.card};border:1px solid ${C.border};border-left:3px solid ${color};border-radius:4px;padding:18px;margin-bottom:4px;">
      <div style="font-size:9px;letter-spacing:2px;color:${color};margin-bottom:12px;font-weight:bold;text-transform:uppercase;">${label}</div>
      ${empty}${rows}
      <div style="display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid ${C.border};">
        <input id="priority-input-${key}" placeholder="${placeholder}" onkeydown="if(event.key==='Enter')addPriority('${key}')" style="flex:1;background:${C.bg};border:1px solid ${C.border};border-radius:3px;padding:7px 10px;color:${C.text};font-size:12px;font-family:Arial;outline:none;">
        <button onclick="addPriority('${key}')" style="padding:7px 16px;background:${color};color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:11px;font-family:Arial;font-weight:bold;">+ Add</button>
      </div>
    </div>`;
}
function addPriority(key){
  const input=document.getElementById(`priority-input-${key}`);
  if(!input||!input.value.trim()) return;
  if(!priorities[key]) priorities[key]=[];
  priorities[key].push(input.value.trim());
  save();renderMain();
}
function deletePriority(key,idx){
  if(!priorities[key]) return;
  priorities[key].splice(idx,1);
  save();renderMain();
}

function renderExcoOKRs(){
  const color=C.exco;
  const goalCards=OKR_GOALS.map(goal=>{
    const open=expandedOKRs[goal.id];
    const rags=goal.measures.map((_,i)=>(okrData[`${goal.id}_${i}`]||{}).rag);
    const hasR=rags.some(r=>r==='R'),hasA=rags.some(r=>r==='A'),hasG=rags.some(r=>r==='G');
    const sc=hasR?C.red:hasA?C.amber:hasG?C.green:C.muted;
    const sl=hasR?'R':hasA?'A':hasG?'G':'–';
    const rows=!open?'':goal.measures.map((m,i)=>{
      const k=`${goal.id}_${i}`;const d=okrData[k]||{};const rag=d.rag;
      const ragBtns=['R','A','G'].map(r=>`<button onclick="setOkrRag('${k}','${r}')" style="width:24px;height:24px;border-radius:3px;border:none;cursor:pointer;font-size:9px;font-weight:bold;font-family:Arial;background:${rag===r?RAG_COLORS[r]:RAG_COLORS[r]+'30'};color:${rag===r?'#fff':RAG_COLORS[r]};">${r}</button>`).join('');
      return `<div style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid ${C.border};">
        <div style="font-size:11px;color:${C.text};line-height:1.5;">${m}</div>
        <input value="${(d.target||'').replace(/"/g,'&quot;')}" onblur="saveOkr('${k}','target',this.value)" placeholder="Target…" style="background:${C.bg};border:1px solid ${C.border};border-radius:3px;padding:5px 8px;font-size:11px;font-family:Arial;color:${C.text};outline:none;width:100%;">
        <input value="${(d.actual||'').replace(/"/g,'&quot;')}" onblur="saveOkr('${k}','actual',this.value)" placeholder="Actual…" style="background:${C.bg};border:1px solid ${C.border};border-radius:3px;padding:5px 8px;font-size:11px;font-family:Arial;color:${C.text};outline:none;width:100%;">
        <div style="display:flex;gap:3px;flex-shrink:0;">${ragBtns}</div>
      </div>`;
    }).join('');
    return `<div style="border:1px solid ${C.border};border-radius:4px;margin-bottom:8px;overflow:hidden;">
      <div onclick="toggleOKR('${goal.id}')" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;background:${open?C.primary+'10':'#fff'};">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="min-width:22px;height:22px;border-radius:3px;background:${sc};color:#fff;font-size:9px;font-weight:bold;display:flex;align-items:center;justify-content:center;">${sl}</div>
          <span style="font-size:12.5px;font-weight:bold;color:${C.text};">${goal.label}</span>
          <span style="font-size:10px;color:${C.muted};">${goal.measures.length} measurable${goal.measures.length>1?'s':''}</span>
        </div>
        <span style="color:${C.muted};font-size:10px;">${open?'▲':'▼'}</span>
      </div>
      ${open?`<div style="padding:0 14px 12px;">
        <div style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;padding:6px 0;border-bottom:2px solid ${C.border};margin-bottom:2px;">
          <div style="font-size:9px;font-weight:bold;color:${C.muted};letter-spacing:1px;text-transform:uppercase;">Measurable</div>
          <div style="font-size:9px;font-weight:bold;color:${C.muted};letter-spacing:1px;text-transform:uppercase;">Target</div>
          <div style="font-size:9px;font-weight:bold;color:${C.muted};letter-spacing:1px;text-transform:uppercase;">Actual</div>
          <div style="font-size:9px;font-weight:bold;color:${C.muted};letter-spacing:1px;text-transform:uppercase;">RAG</div>
        </div>${rows}
      </div>`:''}
    </div>`;
  }).join('');
  return `<div style="background:${C.card};border:1px solid ${C.border};border-left:3px solid ${color};border-radius:4px;padding:18px;margin-bottom:4px;">
    <div style="font-size:9px;letter-spacing:2px;color:${color};margin-bottom:4px;font-weight:bold;text-transform:uppercase;">Strategic OKRs</div>
    <div style="font-size:11px;color:${C.subText};margin-bottom:14px;">Click a goal to expand. Enter targets and actuals, then set RAG status per measurable.</div>
    ${goalCards}
  </div>`;
}
function toggleOKR(id){expandedOKRs[id]=!expandedOKRs[id];renderMain();}
function saveOkr(k,field,val){if(!okrData[k])okrData[k]={};okrData[k][field]=val;save();}
function setOkrRag(k,r){if(!okrData[k])okrData[k]={};okrData[k].rag=okrData[k].rag===r?null:r;save();renderMain();}

function renderActions(mid){
  const meta=META[mid];const st=getStats(mid);const acts=getFiltered(mid);const f=filterFor[mid]||'all';
  const openB=st.open>0?`<span style="font-size:10px;color:${C.light};background:${C.primary}25;padding:2px 8px;border-radius:8px;">${st.open} open</span>`:'';
  const ovB=st.overdue>0?`<span style="font-size:10px;color:${C.red};background:${C.red}20;padding:2px 8px;border-radius:8px;">${st.overdue} overdue</span>`:'';
  const closedB=st.closed>0?`<span style="font-size:10px;color:${C.green};background:${C.green}20;padding:2px 8px;border-radius:8px;">${st.closed} closed</span>`:'';
  const addBtn=`<button onclick="toggleAddForm('${mid}')" style="padding:7px 14px;background:${addingFor===mid?C.muted:C.primary};color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:11px;font-weight:bold;font-family:Arial;">${addingFor===mid?'✕ Cancel':'+ Add Action'}</button>`;
  const addForm=addingFor===mid?`<div style="background:${C.bg};border:1px solid ${C.primary}60;border-radius:4px;padding:14px;margin-bottom:12px;">
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px;">
      <input id="aTitle" type="text" placeholder="Action item *" value="${formData.title}" oninput="formData.title=this.value" style="background:${C.card};border:1px solid ${C.border};border-radius:3px;padding:7px 9px;color:${C.text};font-size:11px;outline:none;font-family:Arial;">
      <input id="aOwner" type="text" placeholder="Owner" value="${formData.owner}" oninput="formData.owner=this.value" style="background:${C.card};border:1px solid ${C.border};border-radius:3px;padding:7px 9px;color:${C.text};font-size:11px;outline:none;font-family:Arial;">
      <input id="aDue" type="date" value="${formData.dueDate}" oninput="formData.dueDate=this.value" style="background:${C.card};border:1px solid ${C.border};border-radius:3px;padding:7px 9px;color:${C.text};font-size:11px;outline:none;font-family:Arial;color-scheme:light;">
    </div>
    <button onclick="addAction('${mid}')" style="padding:7px 16px;background:${C.green};color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:11px;font-weight:bold;font-family:Arial;">Save Action</button>
  </div>`:'';
  const filterBtns=['all','open','overdue','closed'].map(fv=>{
    const active=f===fv;
    const bg=active?(fv==='overdue'?C.red:fv==='closed'?C.green:fv==='open'?C.primary:meta.color):C.border;
    return `<button onclick="setFilter('${mid}','${fv}')" style="padding:4px 11px;border-radius:3px;border:none;cursor:pointer;font-size:10px;font-family:Arial;font-weight:${active?'bold':'normal'};background:${bg};color:${active?'#fff':C.subText};">${fv.charAt(0).toUpperCase()+fv.slice(1)}</button>`;
  }).join('');
  const emptyMsg=acts.length===0?`<div style="text-align:center;padding:26px;color:${C.muted};font-size:11px;background:${C.card};border-radius:4px;border:1px dashed ${C.border};">${f==='all'?'No action items yet. Click "+ Add Action" to begin tracking.':'No '+f+' items.'}</div>`:'';
  const actRows=acts.map(a=>{
    const ov=isOverdue(a);const cl=a.status==='closed';
    const ownerSpan=a.owner?`<span>👤 ${a.owner}</span>`:'';
    const dueSpan=`<span id="date_${mid}_${a.id}" onclick="editActionDate('${mid}',${a.id})" style="color:${ov?C.red:cl?C.green:C.subText};cursor:pointer;" title="Click to edit date">${a.dueDate?`📅 ${a.dueDate}${ov?' &#x2014; OVERDUE':''}`:`<span style="color:${C.muted};font-style:italic;">+ add date</span>`}</span>`;
    const closedSpan=cl?`<span style="color:${C.green};">✓ Closed ${a.closedAt?a.closedAt.slice(0,10):''}</span>`:'';
    const closeBtn=!cl?`<button onclick="closeAction('${mid}',${a.id})" style="padding:4px 9px;background:${C.green};color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:10px;font-family:Arial;font-weight:bold;" title="Mark closed">✓</button>`:`<button onclick="reopenAction('${mid}',${a.id})" style="padding:4px 9px;background:${C.amber};color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:10px;font-family:Arial;font-weight:bold;" title="Reopen">↩ Reopen</button>`;
    return `<div style="display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:4px;margin-bottom:6px;background:${ov?C.red+'10':C.card};border:1px solid ${ov?C.red+'50':cl?C.green+'30':C.border};">
      <div style="width:9px;height:9px;border-radius:2px;background:${ov?C.red:cl?C.green:C.primary};margin-top:4px;flex-shrink:0;"></div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:12px;font-weight:bold;color:${cl?C.subText:C.text};text-decoration:${cl?'line-through':'none'};word-break:break-word;">${a.title}</div>
        <div style="display:flex;gap:12px;margin-top:3px;font-size:10px;color:${C.subText};flex-wrap:wrap;">${ownerSpan}${dueSpan}${closedSpan}</div>
      </div>
      <div style="display:flex;gap:4px;flex-shrink:0;">${closeBtn}${cl?`<button onclick="if(confirm('Permanently delete this action?'))deleteAction('${mid}',${a.id})" style="padding:4px 9px;background:${C.border};color:${C.subText};border:none;border-radius:3px;cursor:pointer;font-size:10px;font-family:Arial;" title="Delete permanently">✕</button>`:''}</div>
    </div>`;
  }).join('');
  return `<div style="margin-top:24px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span style="font-size:9px;letter-spacing:2px;color:${C.primary};font-weight:bold;text-transform:uppercase;">Action Items</span>
        ${openB}${ovB}${closedB}
      </div>${addBtn}
    </div>
    ${addForm}
    <div style="display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;">${filterBtns}</div>
    ${emptyMsg}${actRows}
  </div>`;
}

function toggleItem(k){expandedItems[k]=!expandedItems[k];renderMain();}
function setDept(d){activeDept=d;editingKpi=null;renderMain();}
function setRag(dept,idx,r){const k=`${dept}_${idx}`;ragMap[k]=ragMap[k]===r?null:r;save();renderMain();}
function setFilter(mid,f){filterFor[mid]=f;renderMain();}
function toggleAddForm(mid){addingFor=addingFor===mid?null:mid;formData={title:'',owner:'',dueDate:''};renderMain();}
function startEditKpi(key,name){editingKpi=key;renderMain();setTimeout(()=>{const el=document.getElementById('kpiInput');if(el){el.focus();el.value=name;}},50);}
function handleKpiKey(e,key){if(e.key==='Enter')saveKpi(key);if(e.key==='Escape')cancelKpi();}
function saveKpi(key){
  const el=document.getElementById('kpiInput');
  if(!el||!el.value.trim()){cancelKpi();return;}
  const parts=key.split('_');const idx=parseInt(parts[parts.length-1]);const dept=parts.slice(0,-1).join('_');
  const updated=[...(kpiNames[dept]||DEFAULT_KPIS[dept])];updated[idx]=el.value.trim();kpiNames[dept]=updated;
  editingKpi=null;save();renderMain();
}
function cancelKpi(){editingKpi=null;renderMain();}
function addAction(mid){
  const t=document.getElementById('aTitle');const o=document.getElementById('aOwner');const d=document.getElementById('aDue');
  if(!t||!t.value.trim())return;
  const a={id:Date.now(),title:t.value.trim(),owner:o?o.value.trim():'',dueDate:d?d.value:'',status:'open',createdAt:new Date().toISOString()};
  if(!actions[mid])actions[mid]=[];actions[mid].push(a);formData={title:'',owner:'',dueDate:''};addingFor=null;save();render();
}
function closeAction(mid,id){actions[mid]=actions[mid].map(a=>a.id===id?{...a,status:'closed',closedAt:new Date().toISOString()}:a);save();render();}
function reopenAction(mid,id){actions[mid]=actions[mid].map(a=>a.id===id?{...a,status:'open',closedAt:undefined}:a);save();render();}
function deleteAction(mid,id){actions[mid]=actions[mid].filter(a=>a.id!==id);save();render();}
function editActionDate(mid,id){
  const el=document.getElementById('date_'+mid+'_'+id);
  if(!el)return;
  const a=(actions[mid]||[]).find(a=>a.id===id);
  if(!a)return;
  el.innerHTML=`<input type="date" value="${a.dueDate||''}" onchange="saveActionDate('${mid}',${id},this.value)" onblur="saveActionDate('${mid}',${id},this.value)" style="background:transparent;border:none;border-bottom:1px solid ${C.primary};color:${C.text};font-size:10px;font-family:Arial;outline:none;cursor:pointer;color-scheme:light;">`;
  el.querySelector('input').focus();
}
function saveActionDate(mid,id,val){
  const a=(actions[mid]||[]).find(a=>a.id===id);
  if(!a)return;
  a.dueDate=val;
  save();render();
}

// ── KPI Results helpers ────────────────────────────────────────────────────────
function deptId(d){return d.replace(/[^a-zA-Z0-9]/g,'_');}

function calcRag(actual,target,dir){
  const a=parseFloat(actual),t=parseFloat(target);
  if(isNaN(a)||isNaN(t)||t===0||dir==='info')return null;
  const ratio=a/t;
  if(dir==='higher') return ratio>=0.9?'G':ratio>=0.75?'A':'R';
  if(dir==='lower')  return ratio<=1.1?'G':ratio<=1.25?'A':'R';
  return null;
}

function setPeriod(v){kpiPeriod=v;save();}
function setResultsDept(d){activeResultsDept=d;renderMain();}

function updateKpiActual(dept,idx){
  const did=deptId(dept);
  const tEl=document.getElementById('t_'+did+'_'+idx);
  const aEl=document.getElementById('a_'+did+'_'+idx);
  if(!tEl||!aEl)return;
  const key=dept+'_'+idx;
  kpiActuals[key]={target:tEl.value,actual:aEl.value};
  const meta=(KPI_META[dept]||[])[idx]||{};
  const rag=calcRag(aEl.value,tEl.value,meta.d);
  const ragEl=document.getElementById('rag_'+did+'_'+idx);
  if(ragEl){
    if(rag){ragEl.style.background=RAG_COLORS[rag];ragEl.style.color='#fff';ragEl.textContent=rag;ragEl.style.opacity='1';}
    else{ragEl.style.background=C.muted;ragEl.style.color=C.subText;ragEl.textContent='–';ragEl.style.opacity='0.4';}
  }
  if(rag)ragMap[key]=rag; else delete ragMap[key];
  updateResultsSummary(dept);
  save();
}

function updateResultsSummary(dept){
  const did=deptId(dept);
  const kpis=kpiNames[dept]||DEFAULT_KPIS[dept]||[];
  const meta=KPI_META[dept]||[];
  let g=0,a=0,r=0;
  kpis.forEach((_,idx)=>{
    const v=kpiActuals[dept+'_'+idx];
    const m=meta[idx]||{};
    if(v){const rag=calcRag(v.actual,v.target,m.d);if(rag==='G')g++;else if(rag==='A')a++;else if(rag==='R')r++;}
  });
  const el=document.getElementById('rsum_'+did);
  if(el){
    el.innerHTML=(g||a||r)
      ?`<span style="color:${C.green};font-size:10px;font-weight:bold;">● ${g} Green</span>&nbsp;&nbsp;<span style="color:${C.amber};font-size:10px;font-weight:bold;">● ${a} Amber</span>&nbsp;&nbsp;<span style="color:${C.red};font-size:10px;font-weight:bold;">● ${r} Red</span>`
      :`<span style="color:${C.muted};font-size:10px;">No data entered</span>`;
  }
}

function renderKpiResults(){
  const depts=Object.keys(DEFAULT_KPIS);
  const kpis=kpiNames[activeResultsDept]||DEFAULT_KPIS[activeResultsDept]||[];
  const meta=KPI_META[activeResultsDept]||[];
  const did=deptId(activeResultsDept);

  // Overall totals
  let totG=0,totA=0,totR=0,totEntered=0;
  depts.forEach(dep=>{
    const kk=kpiNames[dep]||DEFAULT_KPIS[dep]||[];
    const mm=KPI_META[dep]||[];
    kk.forEach((_,i)=>{
      const v=kpiActuals[dep+'_'+i];
      if(v&&(v.target||v.actual)){
        totEntered++;
        const rag=calcRag(v.actual,v.target,(mm[i]||{}).d);
        if(rag==='G')totG++;else if(rag==='A')totA++;else if(rag==='R')totR++;
      }
    });
  });

  // Dept tabs
  const deptTabs=depts.map(dep=>{
    const kk=kpiNames[dep]||DEFAULT_KPIS[dep]||[];
    const mm=KPI_META[dep]||[];
    let g=0,a=0,r=0;
    kk.forEach((_,i)=>{
      const v=kpiActuals[dep+'_'+i];
      if(v){const rag=calcRag(v.actual,v.target,(mm[i]||{}).d);if(rag==='G')g++;else if(rag==='A')a++;else if(rag==='R')r++;}
    });
    const active=activeResultsDept===dep;
    const dot=r>0?`<span style="font-size:8px;color:${C.red};margin-left:3px;">●</span>`:a>0?`<span style="font-size:8px;color:${C.amber};margin-left:3px;">●</span>`:g>0?`<span style="font-size:8px;color:${C.green};margin-left:3px;">●</span>`:'';
    const border=r>0?C.red+'60':a>0?C.amber+'50':C.border;
    return `<button onclick="setResultsDept('${dep.replace(/'/g,"\\'")}')" style="padding:5px 10px;border-radius:3px;border:1px solid ${border};cursor:pointer;font-size:10.5px;font-family:Arial;background:${active?C.primary:'transparent'};color:${active?C.white:C.subText};font-weight:${active?'bold':'normal'};">${dep}${dot}</button>`;
  }).join('');

  // KPI rows
  const rows=kpis.map((name,idx)=>{
    const m=meta[idx]||{};
    const key=activeResultsDept+'_'+idx;
    const saved=kpiActuals[key]||{};
    const tVal=saved.target||'';
    const aVal=saved.actual||'';
    const rag=calcRag(aVal,tVal,m.d);
    const dirLabel=m.d==='higher'
      ?`<span title="Higher is better" style="color:${C.green};font-size:9px;font-weight:bold;">↑ Higher</span>`
      :m.d==='lower'
      ?`<span title="Lower is better" style="color:${C.lightest};font-size:9px;font-weight:bold;">↓ Lower</span>`
      :`<span title="Informational" style="color:${C.muted};font-size:9px;">ℹ Info</span>`;
    const ragBg=rag?RAG_COLORS[rag]:C.muted;
    const ragColor=rag?'#fff':C.subText;
    const ragText=rag||'–';
    const ragOpacity=rag?'1':'0.4';
    const inp=`background:${C.bg};border:1px solid ${C.border};border-radius:3px;padding:7px 10px;color:${C.text};font-size:12px;font-family:Arial;outline:none;width:100%;transition:border-color 0.15s;`;
    return `<div style="display:grid;grid-template-columns:1fr 55px 140px 140px 46px;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid ${C.border}25;">
      <div>
        <div style="font-size:12px;color:${C.text};line-height:1.4;">${name}</div>
        <div style="margin-top:3px;">${dirLabel}</div>
      </div>
      <div style="text-align:center;font-size:10px;color:${C.subText};">${m.u||'—'}</div>
      <input type="number" id="t_${did}_${idx}" placeholder="Target" value="${tVal}"
        oninput="updateKpiActual('${activeResultsDept.replace(/'/g,"\\'")}',${idx})"
        onfocus="this.style.borderColor='${C.primary}'" onblur="this.style.borderColor='${C.border}'"
        style="${inp}" step="any">
      <input type="number" id="a_${did}_${idx}" placeholder="Actual" value="${aVal}"
        oninput="updateKpiActual('${activeResultsDept.replace(/'/g,"\\'")}',${idx})"
        onfocus="this.style.borderColor='${C.primary}'" onblur="this.style.borderColor='${C.border}'"
        style="${inp}" step="any">
      <div style="display:flex;justify-content:center;">
        <div id="rag_${did}_${idx}" style="width:36px;height:36px;border-radius:4px;background:${ragBg};color:${ragColor};font-size:11px;font-weight:bold;opacity:${ragOpacity};display:flex;align-items:center;justify-content:center;letter-spacing:0.5px;">${ragText}</div>
      </div>
    </div>`;
  }).join('');

  const overallBar=totEntered>0?`
    <div style="background:${C.card};border:1px solid ${C.border};border-radius:4px;padding:12px 18px;margin-bottom:16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
      <span style="font-size:9px;letter-spacing:2px;color:${C.primary};font-weight:bold;text-transform:uppercase;">Overall</span>
      <span style="font-size:11px;color:${C.green};font-weight:bold;">● ${totG}&nbsp;Green</span>
      <span style="font-size:11px;color:${C.amber};font-weight:bold;">● ${totA}&nbsp;Amber</span>
      <span style="font-size:11px;color:${C.red};font-weight:bold;">● ${totR}&nbsp;Red</span>
      <span style="font-size:10px;color:${C.muted};">${totEntered} of ${Object.values(DEFAULT_KPIS).reduce((s,v)=>s+v.length,0)} KPIs with data</span>
    </div>`:
    `<div style="background:${C.card};border:1px solid ${C.border};border-radius:4px;padding:12px 18px;margin-bottom:16px;font-size:11px;color:${C.muted};text-align:center;">
      Select a department below and enter Target &amp; Actual values — RAG status will calculate automatically.
    </div>`;

  return `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:10px;">
      <div>
        <div style="font-size:22px;font-weight:bold;color:${C.text};letter-spacing:0.5px;">KPI Results Entry</div>
        <div style="font-size:9px;letter-spacing:2.5px;color:${C.subText};text-transform:uppercase;margin-top:2px;">Al Laith · Departmental Performance · Target vs Actual</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:10px;color:${C.subText};">Reporting Period</span>
        <input type="month" value="${kpiPeriod}" onchange="setPeriod(this.value)"
          style="background:${C.card};border:1px solid ${C.border};border-radius:3px;padding:5px 9px;color:${C.text};font-size:11px;font-family:Arial;outline:none;color-scheme:light;">
      </div>
    </div>
    <div style="width:44px;height:3px;background:${C.primary};border-radius:2px;margin-bottom:18px;"></div>

    ${overallBar}

    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px;">${deptTabs}</div>

    <div style="background:${C.card};border:1px solid ${C.border};border-left:3px solid ${C.management};border-radius:4px;padding:18px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;flex-wrap:wrap;gap:8px;">
        <div style="font-size:9px;letter-spacing:2px;color:${C.management};font-weight:bold;text-transform:uppercase;">${activeResultsDept}</div>
        <div id="rsum_${did}" style="font-size:10px;"></div>
      </div>
      <div style="font-size:11px;color:${C.subText};margin-bottom:14px;">Enter a Target and Actual for each KPI. RAG is calculated automatically. &nbsp;↑ Higher is better &nbsp;·&nbsp; ↓ Lower is better &nbsp;·&nbsp; ℹ Informational</div>
      <div style="display:grid;grid-template-columns:1fr 55px 140px 140px 46px;gap:8px;padding:6px 0;border-bottom:1px solid ${C.border};margin-bottom:2px;">
        <div style="font-size:9px;color:${C.muted};font-weight:bold;letter-spacing:1px;text-transform:uppercase;">KPI</div>
        <div style="font-size:9px;color:${C.muted};font-weight:bold;letter-spacing:1px;text-align:center;text-transform:uppercase;">Unit</div>
        <div style="font-size:9px;color:${C.muted};font-weight:bold;letter-spacing:1px;text-transform:uppercase;">Target</div>
        <div style="font-size:9px;color:${C.muted};font-weight:bold;letter-spacing:1px;text-transform:uppercase;">Actual</div>
        <div style="font-size:9px;color:${C.muted};font-weight:bold;letter-spacing:1px;text-align:center;text-transform:uppercase;">RAG</div>
      </div>
      ${rows}
      <div style="margin-top:14px;padding:9px 12px;background:${C.primary}15;border-radius:3px;font-size:10.5px;color:${C.subText};line-height:1.8;">
        💡 <strong style="color:${C.primary};">Auto RAG thresholds:</strong>
        <span style="color:${C.green};">Green</span> = actual ≥ 90% of target &nbsp;·&nbsp;
        <span style="color:${C.amber};">Amber</span> = 75–90% &nbsp;·&nbsp;
        <span style="color:${C.red};">Red</span> = below 75%
        &nbsp;(reversed for ↓ lower-is-better KPIs).
        Results automatically update the <strong style="color:${C.management};">Mgmt &amp; Ops</strong> KPI dashboard.
      </div>
    </div>`;
}

// ── Cloud Backup ──────────────────────────────────────────────────────────────
function getCloudUrl(){return localStorage.getItem('al_mf_cloud_url')||'';}
function setCloudStatus(msg,isErr){const el=document.getElementById('cloud-status');if(el){el.textContent=msg;el.style.color=isErr?'#c0392b':'#27ae60';}}

function showCloudModal(){
  const existing=document.getElementById('cloud-overlay');if(existing)existing.remove();
  const url=getCloudUrl();
  const lastTs=localStorage.getItem('al_mf_cloud_ts')||'Never';
  const ov=document.createElement('div');
  ov.id='cloud-overlay';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:1000;';
  ov.innerHTML=`<div style="background:#fff;border-radius:8px;padding:28px 30px;width:380px;box-shadow:0 8px 32px rgba(0,0,0,0.25);font-family:Arial;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div style="font-size:15px;font-weight:bold;color:${C.text};">&#9729; Cloud Backup</div>
      <button onclick="closeCloudModal()" style="background:none;border:none;font-size:18px;cursor:pointer;color:${C.muted};">&#10005;</button>
    </div>
    <div style="font-size:11px;color:${C.muted};margin-bottom:6px;">Google Apps Script Web App URL</div>
    <input id="cloud-url-input" type="text" value="${url}" placeholder="https://script.google.com/macros/s/…/exec"
      style="width:100%;border:1px solid ${C.border};border-radius:4px;padding:9px;font-size:11px;font-family:Arial;box-sizing:border-box;outline:none;">
    <div style="font-size:10px;color:${C.muted};margin-top:5px;">Last backup: ${lastTs}</div>
    <div id="cloud-status" style="min-height:16px;font-size:11px;margin-top:8px;"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button onclick="restoreFromCloud()" style="flex:1;padding:10px;border:1px solid ${C.border};border-radius:4px;background:#fff;color:${C.subText};cursor:pointer;font-size:12px;">&#8595; Restore</button>
      <button onclick="backupToCloud()" style="flex:1;padding:10px;border:none;border-radius:4px;background:${C.primary};color:#fff;cursor:pointer;font-size:12px;font-weight:bold;">&#8593; Backup Now</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
}

function closeCloudModal(){const el=document.getElementById('cloud-overlay');if(el)el.remove();}

function backupToCloud(){
  const urlInput=document.getElementById('cloud-url-input');
  const url=(urlInput?urlInput.value.trim():getCloudUrl());
  if(!url){setCloudStatus('Please enter your Apps Script URL first.',true);return;}
  localStorage.setItem('al_mf_cloud_url',url);
  setCloudStatus('Saving…',false);
  const payload={data:{actions,priorities,ragMap,kpiNames,kpiActuals,kpiPeriod},note:'Meeting Framework backup'};
  fetch(url,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)})
    .then(()=>{
      const ts=new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
      localStorage.setItem('al_mf_cloud_ts',ts);
      setCloudStatus('Backup saved ✓',false);
      render();
    })
    .catch(()=>setCloudStatus('Backup failed — check your URL.',true));
}

function restoreFromCloud(){
  const urlInput=document.getElementById('cloud-url-input');
  const url=(urlInput?urlInput.value.trim():getCloudUrl());
  if(!url){setCloudStatus('Please enter your Apps Script URL first.',true);return;}
  localStorage.setItem('al_mf_cloud_url',url);
  setCloudStatus('Restoring…',false);
  fetch(url)
    .then(r=>r.json())
    .then(res=>{
      if(!res.ok||!res.data)throw new Error('No data');
      const d=res.data;
      if(d.actions)    {actions=d.actions;    localStorage.setItem('al_mf_actions',    JSON.stringify(actions));}
      if(d.priorities) {priorities=d.priorities;localStorage.setItem('al_mf_priorities',JSON.stringify(priorities));}
      if(d.ragMap)     {ragMap=d.ragMap;       localStorage.setItem('al_mf_rag',        JSON.stringify(ragMap));}
      if(d.kpiNames)   {kpiNames=d.kpiNames;   localStorage.setItem('al_mf_kpi',        JSON.stringify(kpiNames));}
      if(d.kpiActuals) {kpiActuals=d.kpiActuals;localStorage.setItem('al_mf_actuals',   JSON.stringify(kpiActuals));}
      if(d.kpiPeriod!==undefined){kpiPeriod=d.kpiPeriod;localStorage.setItem('al_mf_kpi_period',String(kpiPeriod));}
      if(res.savedAt)  {localStorage.setItem('al_mf_cloud_ts',res.savedAt);}
      setCloudStatus(`Restored from ${res.savedAt||'cloud'} ✓`,false);
      render();
    })
    .catch(()=>setCloudStatus('Restore failed — check your URL or no backup exists yet.',true));
}

render();
</script>
